plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hypothermia_core" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

base {
	archivesName = "hypothermia_core"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.register('copyToModrinth') {
    doLast {
        def targetProfiles = [
            "C:\\Users\\chill\\AppData\\Roaming\\ModrinthApp\\profiles\\Fabric 1.21.1 (1)\\mods",
            "C:\\Users\\chill\\AppData\\Roaming\\ModrinthApp\\profiles\\Fabric 1.21\\mods",
            "D:\\Users\\Zevaldo\\curseforge\\minecraft\\Instances\\Fabric 1.21\\mods",
            "D:\\Users\\Zevaldo\\AppData\\Roaming\\ModrinthApp\\profiles\\Fabric 1.21\\mods",
            "D:\\Users\\Zevaldo\\AppData\\Roaming\\ModrinthApp\\profiles\\Alaskan Wilderness 1.0.0\\mods",
            "D:\\Users\\Zevaldo\\AppData\\Roaming\\ModrinthApp\\profiles\\Hypothermia 4\\mods",
            "D:\\Users\\Zevaldo\\AppData\\Roaming\\ModrinthApp\\profiles\\Another clean fabric\\mods"
        ]
        def jarFile = tasks.remapJar.archiveFile.get().asFile
        if (jarFile.exists()) {
            targetProfiles.each { modsFolder ->
                def dir = file(modsFolder)
                if (dir.exists()) {
                    // Clean up stale hypothermia_core builds in target folder
                    dir.listFiles().each { f ->
                        if (f.name.startsWith("hypothermia_core") && f.name != jarFile.name) {
                            f.delete()
                            println "Removed old build ${f.name} from ${modsFolder}"
                        }
                    }
                    copy {
                        from jarFile
                        into modsFolder
                    }
                    println "Successfully copied ${jarFile.name} to ${modsFolder}"
                }
            }
        } else {
            println "Remapped jar file not found, run 'remapJar' task first."
        }
    }
}

build.finalizedBy('copyToModrinth')

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
